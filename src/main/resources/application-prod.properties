# ===============================
# InternIQ Production Config
# Profile: prod
# ===============================

spring.application.name=interniq-backend

# Render port
server.port=${PORT:10000}
server.address=0.0.0.0

# ===============================
# Seed Data
# ===============================
# IMPORTANT: must be false in production
application.seed-demo-data=${SEED_DEMO_DATA:false}

# ===============================
# Frontend URL
# ===============================
# Used for password reset email link
app.frontend-url=${FRONTEND_URL:https://test-frontend-sigma-bay.vercel.app}

# ===============================
# Database - Aiven MySQL
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# JWT
# ===============================
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
application.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
application.security.refresh-token.enabled=${REFRESH_TOKEN_ENABLED:true}

# ===============================
# CORS
# ===============================
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://test-frontend-sigma-bay.vercel.app}

# ===============================
# Cookies
# ===============================
application.security.cookie.secure=${COOKIE_SECURE:true}
application.security.cookie.same-site=${COOKIE_SAME_SITE:None}
application.security.cookie.path=${COOKIE_PATH:/api/auth}

# ===============================
# AI Config
# ===============================
application.ai.provider=${AI_PROVIDER:mock}
application.ai.base-url=${AI_BASE_URL:https://api.openai.com}
application.ai.api-key=${AI_API_KEY:}
application.ai.model=${AI_MODEL:gpt-4o-mini}

# ===============================
# Email App Config
# ===============================
application.email.enabled=${MAIL_ENABLED:true}
application.email.provider=${EMAIL_PROVIDER:smtp}
application.email.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@interniq.com}}
application.email.app-name=${EMAIL_APP_NAME:InternIQ}
application.email.app-url=${FRONTEND_URL:https://test-frontend-sigma-bay.vercel.app}
application.email.fail-on-error=${EMAIL_FAIL_ON_ERROR:true}

# Used by PasswordResetService
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@interniq.local}}

# ===============================
# SMTP / Gmail
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}

# ===============================
# File Upload
# ===============================
application.resume.upload-dir=${RESUME_UPLOAD_DIR:uploads/resumes}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ===============================
# Logs
# ===============================
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=warn
logging.level.org.springframework.web=info

# ===============================
# Email Config - Resend API
# ===============================
application.email.enabled=${MAIL_ENABLED:true}
application.email.provider=${EMAIL_PROVIDER:resend}
application.email.from=${MAIL_FROM:InternIQ <noreply@interniq.com>}
application.email.app-name=${EMAIL_APP_NAME:InternIQ}
application.email.app-url=${FRONTEND_URL:https://test-frontend-sigma-bay.vercel.app}
application.email.fail-on-error=${EMAIL_FAIL_ON_ERROR:false}

resend.api-key=${RESEND_API_KEY:}

# Used by password reset link generation
app.frontend-url=${FRONTEND_URL:https://test-frontend-sigma-bay.vercel.app}
app.mail.from=${MAIL_FROM:InternIQ <noreply@interniq.com>}
